[build]
command = "npm run build"
publish = "dist"

[build.environment]
SECRETS_SCAN_ENABLED = "false"
PUPPETEER_CACHE_DIR = ".cache/puppeteer"

# Cache Control Headers
# HTML files: no-cache (always check for updates, prevents stale prerendered content)
# Assets: long cache with immutable (versioned files never change)

[[headers]]
for = "/*.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.js"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.css"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.woff2"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# 301 redirects to English locale (SEO-friendly permanent redirects)
[[redirects]]
from = "/catalog"
to = "/en/catalog"
status = 301

[[redirects]]
from = "/product/1"
to = "/en/product/universal-rgb-cct"
status = 301

[[redirects]]
from = "/product/2"
to = "/en/product/adjustable-white"
status = 301

# Product ID to slug redirects for all locales
# Product 1: Universal RGB+CCT
[[redirects]]
from = "/en/product/1"
to = "/en/product/universal-rgb-cct"
status = 301

[[redirects]]
from = "/ru/product/1"
to = "/ru/product/universal-rgb-cct"
status = 301

[[redirects]]
from = "/cz/product/1"
to = "/cz/product/univerzalni-rgb-cct"
status = 301

[[redirects]]
from = "/de/product/1"
to = "/de/product/universal-rgb-cct"
status = 301

[[redirects]]
from = "/pl/product/1"
to = "/pl/product/uniwersalny-rgb-cct"
status = 301

# Product 2: Adjustable White
[[redirects]]
from = "/en/product/2"
to = "/en/product/adjustable-white"
status = 301

[[redirects]]
from = "/ru/product/2"
to = "/ru/product/adjustable-white"
status = 301

[[redirects]]
from = "/cz/product/2"
to = "/cz/product/nastavitelna-bila"
status = 301

[[redirects]]
from = "/de/product/2"
to = "/de/product/einstellbares-weiss"
status = 301

[[redirects]]
from = "/pl/product/2"
to = "/pl/product/regulowana-biel"
status = 301

# Category without slug redirects to home
[[redirects]]
from = "/category"
to = "/en/"
status = 301

[[redirects]]
from = "/en/category"
to = "/en/"
status = 301

[[redirects]]
from = "/ru/category"
to = "/ru/"
status = 301

[[redirects]]
from = "/cz/category"
to = "/cz/"
status = 301

[[redirects]]
from = "/de/category"
to = "/de/"
status = 301

[[redirects]]
from = "/pl/category"
to = "/pl/"
status = 301

[[redirects]]
from = "/category/rgb_cct"
to = "/en/category/rgb_cct"
status = 301

[[redirects]]
from = "/category/cct"
to = "/en/category/cct"
status = 301

[[redirects]]
from = "/faq"
to = "/en/faq"
status = 301

[[redirects]]
from = "/about"
to = "/en/about"
status = 301

[[redirects]]
from = "/warranty"
to = "/en/warranty"
status = 301

[[redirects]]
from = "/blog"
to = "/en/blog"
status = 301

# Auth callback - no locale needed
[[redirects]]
from = "/auth/v1/callback"
to = "/index.html"
status = 200
force = true

[[redirects]]
from = "/privacy-policy"
to = "/index.html"
status = 200
force = true

[[redirects]]
from = "/terms"
to = "/index.html"
status = 200
force = true

[[redirects]]
from = "/auth/*"
to = "/index.html"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
# No force = true, so prerendered HTML files take priority